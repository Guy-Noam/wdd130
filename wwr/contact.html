<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Information Form | Rafting-Gold </title>

    <meta name="description" content="Contact Rafting-Gold for information about whitewater rafting adventures, trip reservations, and questions about our services.">
    <meta name="author" content="Guy-Noam BOHUI">

    <link rel="stylesheet" href="styles/rafting.css">


</head>

<body>

    <header>
        <img src="images/z-rapids-trees.jpg" alt="Rafting Logo">

        <nav>
            <ul>
                <li> <a href="index.html"> Home </a> </li>
                <li> <a href="about.html"> About Us</a> </li>
                <li> <a href="trips.html"> Trips </a> </li>
                <li> <a href="contact.html"> Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main class="contact-page">

        <section class="contact-information">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-content">

            <div class="map">
               <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3021.58677613183!2d-111.9034523239353!3d40.771112471384725!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8752f5aa65687281%3A0x8f5cb1a018407710!2sBYU-Pathway%20Worldwide!5e0!3m2!1sfr!2sci!4v1791655133289!5m2!1sfr!2sci"></iframe>
            </div>

            <form class="contact-form" action="#" method="post">

                <div class="form-row">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <fieldset class="purpose">
                    <legend>Message<br>Purpose</legend>

                    <label>
                        <input
                            type="radio"
                            name="purpose"
                            value="general"
                            required>
                        General Inquiry
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="purpose"
                            value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="purpose"
                            value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="message-field">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Type here"
                        required></textarea>
                </div>

                <div class="newsletter">
                    <input
                        type="checkbox"
                        id="subscribe"
                        name="subscribe"
                        value="yes">
                    <label for="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-container">

                <figure class="employee">
                    <img
                        src="images/rafting1.jpg"
                        alt="First employee profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure class="employee">
                    <img
                        src="images/rafting2.jpg"
                        alt="Second employee profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure class="employee">
                    <img
                        src="images/rafting3.jpg"
                        alt="Third employee profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

            </div>
        </section>

    </main>


    <footer>
        <p> &copy; 2026 | Guy Noam BOHUI |Rafting-Gold </p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook_3128304.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin_3128329.png" alt="Linked Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/social_15707749.png" alt="Instagram Icon">
            </a>
        </nav>

    </footer>

</body>


</html>
